    <!-- partial -->
    <!-- EDIT: dulu file ini cuma muat script.js (versi mouse), padahal
         mobile.js (versi touch) sudah ada tapi tidak pernah dipanggil.
         Baris di bawah ini yang menyalakannya: kalau perangkatnya layar
         sentuh, pakai mobile.js; kalau tidak, pakai script.js seperti biasa. -->
    <script>
      var pakaiSentuh = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      var elemenScript = document.createElement("script");
      elemenScript.src = pakaiSentuh ? "./mobile.js" : "./script.js";
      document.body.appendChild(elemenScript);
    </script>
